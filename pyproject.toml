[project]
name = "panda-pytest-assertions"
dynamic = ["version"]
description = "Complex assertions that can be used when writing test with pytest"
authors = [{ name = "Cyber Panda", email = "krunchfrompoland@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pytest >4.6.0",
    "pyyaml >=6.0.1,<7",
]
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[dependency-groups]
dev = [
    "pydoclint",
    "flake8",
    "mypy",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "munch",
    "munch-stubs",
    "types-pyyaml",
]
docs = [
    "mkdocs-material >=9.5.44,<10",
    "mike >=2.1.3,<3",
]

[project.urls]
homepage = "https://github.com/KRunchPL/panda-pytest-assertions"
repository = "https://github.com/KRunchPL/panda-pytest-assertions"
documentation = "https://github.com/KRunchPL/panda-pytest-assertions"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_pytest_assertions"]

[tool.hatch.version]
scheme = "semver"
path = "version.txt"
pattern = "(?P<version>.*)"

[build-system]
requires = ["hatchling", "hatch-semver"]
build-backend = "hatchling.build"

[tool.uv]
system-certs = true
